[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mockmuse-cli"
version = "0.1.0"
description = "mock.muse CLI — crypto airdrops, testnets and building helpers"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "mock.muse" }]
keywords = ["mockmuse", "cli", "crypto", "airdrop", "testnet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mockmuse/mockmuse-cli"
Source = "https://github.com/mockmuse/mockmuse-cli"
Profile = "https://github.com/mockmuse"
Website = "https://mockmuse.github.io"

[project.scripts]
mockmuse = "mockmuse_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
